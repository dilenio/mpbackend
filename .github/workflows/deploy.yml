name: Deploy MockAPI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # 1. CONFIGURAÇÃO SSH E DIRETÓRIO
      # ==========================================
      - name: Configurar Chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Criar Diretório Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/mockapi

      # ==========================================
      # 2. ENVIO DOS ARTEFATOS VIA RSYNC
      # ==========================================
      - name: Enviar Arquivos para a VPS
        run: |
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          
          # Envia todos os arquivos do projeto (exceto node_modules e .git) direto para /var/www/mockapi
          rsync -avz --delete --exclude 'node_modules' --exclude '.git' ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/mockapi/

      # ==========================================
      # 3. INSTALAÇÃO DE PROD E RESTART NO PM2
      # ==========================================
      - name: Atualizar Dependências e Reiniciar no PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/mockapi

            # Instala apenas dependências de produção ignorando scripts desnecessários
            npm install --omit=dev --ignore-scripts

            # ATENÇÃO: Altere "index.js" para o nome real do seu arquivo principal (ex: server.js, app.js, main.js)
            APP_ENTRY="index.js"

            # Gerencia a aplicação no PM2 fixando a porta 3335
            if pm2 describe "mockapi" >/dev/null 2>&1; then
              PORT=3335 pm2 reload mockapi --update-env
            else
              PORT=3335 pm2 start $APP_ENTRY --name "mockapi"
            fi
            
            pm2 save