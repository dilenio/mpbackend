name: Deploy MockAPI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # 1. BUILD DA API
      # ==========================================
      - name: Instalar dependências e compilar
        run: |
          npm install
          npm run build

      # ==========================================
      # 2. ENVIO DOS ARTEFATOS VIA RSYNC
      # ==========================================
      - name: Configurar Chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Criar Diretório Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/mockapi

      - name: Enviar Build e Configurações para a VPS
        run: |
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          
          # Envia a pasta dist e os arquivos essenciais de dependência
          rsync -avz --delete dist/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/mockapi/dist/
          rsync -avz package.json ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/mockapi/
          if [ -f "package-lock.json" ]; then
            rsync -avz package-lock.json ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/mockapi/;
          fi

      # ==========================================
      # 3. INSTALAÇÃO DE PROD E RESTART NO PM2
      # ==========================================
      - name: Atualizar Dependências e Reiniciar no PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/mockapi

            # Instala apenas dependências de produção ignorando scripts desnecessários
            npm install --omit=dev --ignore-scripts

            # Gerencia a aplicação no PM2 fixando a porta 3335
            if pm2 describe "mockapi" >/dev/null 2>&1; then
              PORT=3335 pm2 reload mockapi --update-env
            else
              PORT=3335 pm2 start dist/main.js --name "mockapi"
            fi
            
            pm2 save